          type:
            - "string"
            - "null"
          maxLength: 5000
        reason:
          type:
            - "string"
            - "null"
          maxLength: 1000
        version:
          type:
            - "integer"
            - "null"
          minimum: 0
      required:
        - "clientRequestId"
        - "source"
        - "effectiveFrom"
      allOf:
        -
          if:
            properties:
              source:
                const: "POLICY"
          then:
            required:
              - "policyVersion"
            properties:
              policyVersion:
                type: "integer"
                minimum: 0
              terms:
                type: "null"
        -
          if:
            properties:
              source:
                const: "CUSTOM"
          then:
            required:
              - "terms"
            properties:
              terms:
                "$ref": "#/components/schemas/TuitionTerms"
              policyVersion:
                type: "null"
      description: "Create must omit/null version; replacement requires the original current version and a nonblank reason. POLICY copies all terms after checking the current policy version and ignores no custom terms (custom terms must be absent/null). CUSTOM requires complete mode-compatible terms, with no policyVersion. A clientRequestId is unique per enrollment, bound to the submitted payload plus replaced agreement ID; identical retries return the saved snapshot even after policy or context changes, different payloads conflict. A finite class end requires effectiveTo inside the class dates."
