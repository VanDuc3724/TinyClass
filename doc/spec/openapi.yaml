        "400":
          description: "Invalid body, UUID, pagination, status filter, date or age range (VALIDATION_ERROR, INVALID_JSON, INVALID_PARAMETER, INVALID_PAGINATION, INVALID_STATUS, INVALID_DATE_RANGE, INVALID_AGE_RANGE, INVALID_BIRTH_DATE)."
