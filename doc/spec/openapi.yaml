      description: "Session and current resource access are checked before streaming. Resource support handles RFC 9110 ranges. Responses are private/no-store and nosniff; family download also requires the live learnerDownloadAllowed flag. No public filesystem/Drive URL."
      security:
        -
          sessionCookie: []
      parameters:
        -
          "$ref": "#/components/parameters/RequestId"
        -
          name: "child"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          name: "item"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          name: "file"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          name: "Range"
          in: "header"
          schema:
            type: "string"
      responses:
        "200":
          description: "Whole file, inline for content or attachment for download."
          headers:
            Content-Disposition:
              schema:
                type: "string"
            Accept-Ranges:
              schema:
                type: "string"
                const: "bytes"
          content:
            "application/octet-stream":
              schema:
                type: "string"
                format: "binary"
        "206":
          description: "Requested byte region(s)."
          headers:
            Content-Range:
              schema:
                type: "string"
          content:
            "application/octet-stream":
              schema:
                type: "string"
                format: "binary"
        "400":
          description: "Invalid input, MIME/extension/purpose, dates, completion mode or assignment snapshot."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "401":
          description: "No active session."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "403":
          description: "Wrong role, missing/invalid CSRF, unverified email, content not yet available or download forbidden."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "404":
          description: "Unknown resource, ownership mismatch or current family/recipient access is unavailable."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "409":
          description: "Stale version, state conflict, idempotency mismatch, missing shared-update acknowledgement or storage quota exceeded."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "416":
          description: "Requested range is unsatisfiable."
          headers:
            Content-Range:
              schema:
                type: "string"
        "503":
          description: "Storage temporarily unavailable; no path or provider diagnostics."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
