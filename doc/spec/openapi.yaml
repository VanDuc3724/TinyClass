      operationId: "teacherDashboard"
      summary: "Read class-scoped teacher dashboard"
      description: "TEACHER owner only, consistent repeatable-read snapshot. Optional classId must belong to teacher and scopes every class-related metric, billing and personal update preview. Students counts distinct ACTIVE children enrolled ACTIVE in ACTIVE classes. Published library is global unless class scope; assignments/lessons then come from that class. Pending submissions preserve sent historical work. Vietnam today sessions and present distinct children include eligible SCHEDULED/COMPLETED sessions, exclude CANCELLED and private lesson plans. Existing activity max six/classes max four. Billing adds exact-string open/overdue/month receipts and max-four due invoices; personal updates use current source rights with max three. Read-only navigation never creates business records."
      security:
        -
          sessionCookie: []
      parameters:
        -
          "$ref": "#/components/parameters/RequestId"
