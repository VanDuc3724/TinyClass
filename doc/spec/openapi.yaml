    TuitionTerms:
      type: "object"
      properties:
        pricingMode:
          type: "string"
          enum:
            - "PER_SESSION"
            - "MONTHLY_FIXED"
            - "FULL_PROGRAM"
        collectionTiming:
          type: "string"
          enum:
            - "AT_PERIOD_START"
            - "AT_PERIOD_END"
            - "UPFRONT"
        sessionUnitPriceVnd:
          type:
            - "integer"
            - "null"
          minimum: 0
          maximum: 1000000000000
        monthlyAmountVnd:
          type:
            - "integer"
            - "null"
          minimum: 0
          maximum: 1000000000000
        programTotalVnd:
          type:
            - "integer"
            - "null"
          minimum: 0
          maximum: 1000000000000
        programLabel:
          type:
            - "string"
            - "null"
          maxLength: 200
        expectedSessions:
          type:
            - "integer"
            - "null"
          minimum: 1
          maximum: 10000
        chargeExcusedAbsence:
          type:
            - "boolean"
            - "null"
        chargeUnexcusedAbsence:
          type:
            - "boolean"
            - "null"
        fixedFeeAbsenceRule:
          type:
            - "string"
            - "null"
          enum:
            - "KEEP_AGREED_AMOUNT"
            - "MANUAL_ADJUSTMENT"
            - null
        publicTerms:
          type:
            - "string"
            - "null"
          maxLength: 5000
      required:
        - "pricingMode"
        - "collectionTiming"
      description: "VND integers only, including zero; never rounded. Only fields compatible with the selected mode may be non-null. Per-session explicitly chooses both absence booleans; fixed modes explicitly choose the absence rule. Collection timing is independently selected, with no automatic business default. FULL_PROGRAM requires a nonblank program label and optionally positive expectedSessions; it does not grant course access or create prepaid credit."
      allOf:
        -
          if:
            properties:
              pricingMode:
                const: "PER_SESSION"
          then:
            required:
              - "sessionUnitPriceVnd"
              - "chargeExcusedAbsence"
              - "chargeUnexcusedAbsence"
            properties:
              sessionUnitPriceVnd:
                type: "integer"
              chargeExcusedAbsence:
                type: "boolean"
              chargeUnexcusedAbsence:
                type: "boolean"
              monthlyAmountVnd:
                type: "null"
              programTotalVnd:
                type: "null"
              programLabel:
                type: "null"
              expectedSessions:
                type: "null"
              fixedFeeAbsenceRule:
                type: "null"
        -
          if:
            properties:
              pricingMode:
                const: "MONTHLY_FIXED"
          then:
            required:
              - "monthlyAmountVnd"
              - "fixedFeeAbsenceRule"
            properties:
              monthlyAmountVnd:
                type: "integer"
              fixedFeeAbsenceRule:
                type: "string"
              sessionUnitPriceVnd:
                type: "null"
              programTotalVnd:
                type: "null"
              programLabel:
                type: "null"
              expectedSessions:
                type: "null"
              chargeExcusedAbsence:
                type: "null"
              chargeUnexcusedAbsence:
                type: "null"
        -
          if:
            properties:
              pricingMode:
                const: "FULL_PROGRAM"
          then:
            required:
              - "programTotalVnd"
              - "programLabel"
              - "fixedFeeAbsenceRule"
            properties:
              programTotalVnd:
                type: "integer"
              programLabel:
                type: "string"
                pattern: "\\S"
              fixedFeeAbsenceRule:
                type: "string"
              sessionUnitPriceVnd:
                type: "null"
              monthlyAmountVnd:
                type: "null"
              chargeExcusedAbsence:
                type: "null"
              chargeUnexcusedAbsence:
                type: "null"
