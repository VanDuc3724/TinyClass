          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
      requestBody:
        required: true
        content:
          "multipart/form-data":
            schema:
              "$ref": "#/components/schemas/FileUpload"
