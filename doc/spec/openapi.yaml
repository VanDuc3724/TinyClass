        "409":
          description: "Stale version, state conflict, idempotency mismatch, missing shared-update acknowledgement or storage quota exceeded."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "503":
          description: "Storage temporarily unavailable; no path or provider diagnostics."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
    post:
      tags:
        - "Storage"
      operationId: "uploadFile"
      summary: "Upload a private file"
      description: "TEACHER only; CSRF header required. Tika detection is checked against extension and declared MIME. Images 10 MiB, audio 20 MiB, PDF 50 MiB, MP4/WebM 200 MiB; overall request limit 201 MiB. User-locked quota reservation (default 5 GiB), SHA-256 and private server-generated key. UPLOADING becomes READY after the atomic write; failures retain FAILED metadata without switching storage. Parents cannot upload through this endpoint."
      security:
        -
          sessionCookie: []
      parameters:
        -
          "$ref": "#/components/parameters/RequestId"
        -
          "$ref": "#/components/parameters/Csrf"
      responses:
        "201":
          description: "Upload a private file"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/MediaFileResponse"
        "400":
          description: "Invalid input, MIME/extension/purpose, dates, completion mode or assignment snapshot."
          headers:
            X-Request-ID:
