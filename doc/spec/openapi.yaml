  "/auth/identities/{id}/unlink":
    post:
      tags:
        - "Authentication"
      operationId: "unlinkGoogle"
      summary: "Unlink an owned Google identity"
      description: "Consumes a five-minute one-use reauthentication proof and locks the user. Refuses the last login method, another owner's identity or stale credentials. Success invalidates current cookie and older credential snapshots; password remains usable."
      security:
        - sessionCookie: []
      parameters:
        - "$ref": "#/components/parameters/Id"
        - "$ref": "#/components/parameters/RequestId"
        - "$ref": "#/components/parameters/Csrf"
      responses:
        "200":
          description: "Unlink an owned Google identity"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BooleanResponse"
        "400":
          description: "Invalid input/parameter, expired or wrong-purpose token."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "401":
          description: "No active account session."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "403":
          description: "Missing/invalid CSRF, forbidden account or email verification required."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "409":
          description: "REAUTHENTICATION_REQUIRED, LAST_LOGIN_METHOD, PASSWORD_ALREADY_SET or account/identity conflict."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
  "/auth/password-setup-requests":
    post:
      tags:
        - "Authentication"
      operationId: "requestPasswordSetup"
      summary: "Request a password addition for a verified Google-only account"
      description: "Needs explicit recent authentication and an active session. Sends a one-use SET_PASSWORD token valid for 30 minutes to the account's verified contact email. Does not accept a target email, does not replace Google and is distinct from password reset."
      security:
        - sessionCookie: []
      parameters:
        - "$ref": "#/components/parameters/RequestId"
        - "$ref": "#/components/parameters/Csrf"
      responses:
        "200":
          description: "Request a password addition for a verified Google-only account"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/BooleanResponse"
        "400":
          description: "Invalid input/parameter, expired or wrong-purpose token."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "401":
          description: "No active account session."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "403":
          description: "Missing/invalid CSRF, forbidden account or email verification required."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "409":
          description: "REAUTHENTICATION_REQUIRED, LAST_LOGIN_METHOD, PASSWORD_ALREADY_SET or account/identity conflict."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "429":
          description: "TOO_MANY_ATTEMPTS or EMAIL_COOLDOWN. Auth/preview/invite/accept share the IP limit. Email requests also have a per-email cooldown."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "503":
          description: "MAIL_UNAVAILABLE; no SMTP diagnostics or message content."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
  "/auth/password-setups":
    post:
      tags:
        - "Authentication"
      operationId: "confirmPasswordSetup"
      summary: "Add the initial password using the owner-bound email token"
      description: "Requires the same authenticated account, verified email, no existing password and an unused/unexpired SET_PASSWORD token. RESET_PASSWORD or another user's token is rejected. Success keeps Google but logs out the current session and invalidates older sessions; sign in again."
      security:
        - sessionCookie: []
      parameters:
        - "$ref": "#/components/parameters/RequestId"
        - "$ref": "#/components/parameters/Csrf"
      responses:
        "200":
          description: "Add the initial password using the owner-bound email token"
          headers:
