  "/files/{id}/content":
    get:
      tags:
        - "Storage"
      operationId: "teacherFilecontent"
      summary: "Stream an owned file (content)"
      description: "Session and current resource access are checked before streaming. Resource support handles RFC 9110 ranges. Responses are private/no-store and nosniff; family download also requires the live learnerDownloadAllowed flag. No public filesystem/Drive URL."
      security:
        -
          sessionCookie: []
      parameters:
        -
          "$ref": "#/components/parameters/RequestId"
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          name: "Range"
          in: "header"
          schema:
            type: "string"
      responses:
        "200":
          description: "Whole file, inline for content or attachment for download."
          headers:
            Content-Disposition:
              schema:
                type: "string"
            Accept-Ranges:
              schema:
                type: "string"
                const: "bytes"
          content:
            "application/octet-stream":
              schema:
                type: "string"
                format: "binary"
        "206":
          description: "Requested byte region(s)."
          headers:
            Content-Range:
              schema:
                type: "string"
          content:
            "application/octet-stream":
