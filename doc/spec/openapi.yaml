        source:
          type: "string"
          enum:
            - "POLICY"
            - "CUSTOM"
        policyVersion:
          type:
            - "integer"
            - "null"
          minimum: 0
        terms:
          anyOf:
            -
              "$ref": "#/components/schemas/TuitionTerms"
            -
              type: "null"
        effectiveFrom:
          type: "string"
          format: "date"
          description: "Inclusive Vietnam business date, year 1900–2200."
        effectiveTo:
          type:
            - "string"
            - "null"
          format: "date"
          description: "Inclusive Vietnam business date, year 1900–2200."
