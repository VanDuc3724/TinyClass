openapi: "3.1.0"
info:
  title: "TinyClass API"
  version: "0.0.15"
  description: "Implemented through V16: accounts/classes/family, LOCAL learning/products/reviews, teaching/attendance/observations, tuition and reviewed invoices, manual payment recording/void, atomic integer balance limits, idempotent retries and public exact-child finance history. Google setup and makeup deferred. No bank gateway/refunds; Drive and notifications remain later work."
servers:
  -
    url: "/api/v1"
tags:
  -
    name: "System"
  -
    name: "Authentication"
  -
    name: "Classes"
  -
    name: "Students"
  -
    name: "Family"
  -
    name: "Storage"
  -
    name: "Learning"
  -
    name: "Family learning"
  -
    name: "Dashboard"
  -
    name: "Submissions"
  -
    name: "Teaching schedule"
  -
    name: "Attendance"
  -
    name: "Student notes and progress"
  -
    name: "Tuition settings"
  -
    name: "Invoices"
  -
    name: "Payments"
  -
    name: "Communications"
    description: "Class announcements, revision acknowledgement and personal updates under current source permissions."
paths:
  "/storage-connections":
    get:
      tags:
        - "Storage"
      operationId: "listStorageConnections"
      summary: "List safe storage configuration"
      description: "TEACHER only. Lazily initializes the default LOCAL connection under the user lock. Root paths, storage keys and OAuth secrets are not returned. Only LOCAL is connected in this milestone."
      security:
        -
          sessionCookie: []
      parameters:
        -
          "$ref": "#/components/parameters/RequestId"
      responses:
        "200":
          description: "List safe storage configuration"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/StorageConnectionsResponse"
        "400":
          description: "Invalid input, MIME/extension/purpose, dates, completion mode or assignment snapshot."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "401":
          description: "No active session."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "403":
          description: "Wrong role, missing/invalid CSRF, unverified email, content not yet available or download forbidden."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "404":
          description: "Unknown resource, ownership mismatch or current family/recipient access is unavailable."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "409":
          description: "Stale version, state conflict, idempotency mismatch, missing shared-update acknowledgement or storage quota exceeded."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "503":
          description: "Storage temporarily unavailable; no path or provider diagnostics."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
  "/files":
    get:
      tags:
        - "Storage"
      operationId: "listFiles"
      summary: "List owned files"
      description: "TEACHER-only private library, including failed uploads; ordered by createdAt DESC/id DESC."
      security:
        -
          sessionCookie: []
      parameters:
        -
          "$ref": "#/components/parameters/RequestId"
        -
          "$ref": "#/components/parameters/Page"
        -
          "$ref": "#/components/parameters/Size"
        -
          name: "q"
          in: "query"
          schema:
            type: "string"
            maxLength: 150
        -
          name: "purpose"
          in: "query"
          schema:
            type: "string"
      responses:
        "200":
          description: "List owned files"
          headers:
            X-Request-ID:
