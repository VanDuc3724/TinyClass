          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "409":
          description: "Stale version, state conflict, idempotency mismatch, missing shared-update acknowledgement or storage quota exceeded."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "413":
          description: "FILE_TOO_LARGE; per-kind or multipart limit exceeded."
          content:
