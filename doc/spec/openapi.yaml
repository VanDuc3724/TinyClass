  "/auth/google/callback":
    get:
      tags:
        - "Authentication"
      operationId: "googleCallback"
      summary: "Receive the OIDC authorization-code callback"
      description: "Handled by Spring Security. Validates code exchange/PKCE, state, nonce, issuer, audience, signature and expiration. Identity lookup uses verified issuer/subject; never merges by email. Replaces the OAuth principal with a database-backed local principal. Does not retain authorized-client access/refresh tokens. Success/failure always redirects to the fixed frontend result route. A denied business mapping restores an eligible previous local session."
      security: []
      parameters:
        - name: "state"
          in: "query"
          schema:
            type: "string"
        - name: "code"
          in: "query"
          schema:
            type: "string"
        - name: "error"
          in: "query"
          schema:
            type: "string"
      responses:
        "302":
          description: "Fixed application /auth/google/result; no Google tokens in the target URL."
          headers:
            Location:
              description: "Redirect chosen by the server."
              schema:
                type: "string"
