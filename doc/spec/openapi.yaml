      summary: "Redirect to Google after a prepared start"
      description: "Consumes the pending server-bound flow. Asks only openid/email/profile; Google login does not authorize Drive. Application-generated OAuth state, nonce and PKCE are retained in the session. Direct navigation without preparation returns GOOGLE_CONTEXT_EXPIRED."
      security: []
      responses:
