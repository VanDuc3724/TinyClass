      operationId: "updateTopic"
      summary: "Edit or archive an owned topic"
      description: "Version required; normalized names are unique per teacher. Archiving keeps existing lesson associations."
      security:
        - sessionCookie: []
      parameters:
        - "$ref": "#/components/parameters/RequestId"
