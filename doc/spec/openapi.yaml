  "/dashboard":
    get:
      tags:
        - "Dashboard"
      operationId: "teacherDashboard"
      summary: "Read class-scoped teacher dashboard"
      description: "TEACHER only. One repeatable-read snapshot scoped to the current teacher. Optional classId must belong to that teacher. students counts distinct active profiles with ACTIVE enrollment in ACTIVE classes; activeClasses counts ACTIVE classes. publishedAssignments excludes revoked/draft records and class scope counts only direct CLASS assignments, excluding direct STUDENT assignments. publishedLessons counts the published library globally; within one class it counts distinct published lessons in published CLASS assignments. activity is at most six published lessons/assignments from today in Asia/Ho_Chi_Minh; class scope includes only assignments for that class. recentClasses uses the same scope. No attendance, review or schedule data is fabricated."
      security:
        - sessionCookie: []
      parameters:
        - "$ref": "#/components/parameters/RequestId"
        - name: "classId"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "Dashboard snapshot"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/TeacherDashboardResponse"
        "400":
          description: "Invalid body, UUID, pagination, status filter, date or age range (VALIDATION_ERROR, INVALID_JSON, INVALID_PARAMETER, INVALID_PAGINATION, INVALID_STATUS, INVALID_DATE_RANGE, INVALID_AGE_RANGE, INVALID_BIRTH_DATE)."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "401":
          description: "No active session or invalid login. UNAUTHENTICATED or INVALID_CREDENTIALS."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "403":
          description: "Wrong role, missing/invalid CSRF (ACCESS_DENIED), or INVALID_SETUP_KEY."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "404":
          description: "Class not found or not owned by this teacher."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
components:
  securitySchemes:
    sessionCookie:
      type: "apiKey"
      in: "cookie"
      name: "JSESSIONID"
      description: "HttpOnly session cookie; Secure in production and SameSite=Lax. In-memory sessions expire after 30 minutes of inactivity and on server restart. Account role, status, password change time and credential version are checked against the database on subsequent requests. Password resets, linking/unlinking methods and adding a password invalidate older credential snapshots."
  parameters:
    Id:
      name: "id"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
    RequestId:
      name: "X-Request-ID"
      in: "header"
      required: false
      schema:
        type: "string"
        maxLength: 100
        pattern: "^[A-Za-z0-9._-]{1,100}$"
      description: "Invalid IDs are replaced with a UUID."
    Csrf:
      name: "X-CSRF-TOKEN"
      in: "header"
      required: true
      schema:
        type: "string"
      description: "Masked token from GET /auth/csrf. Refresh after login/logout and OAuth callbacks. Required on state-changing application endpoints, including Google start; OIDC redirect GETs use server-bound state and nonce instead."
    Page:
      name: "page"
      in: "query"
      schema:
        type: "integer"
        minimum: 0
        default: 0
    Size:
      name: "size"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: "q"
      in: "query"
      schema:
        type: "string"
        maxLength: 150
      description: "Case-insensitive literal substring. Percent and underscore are escaped. Lists use stable createdAt DESC, id DESC order."
  headers:
    RequestId:
      description: "Request correlation ID in headers, errors and logs."
      schema:
        type: "string"
  schemas:
    StorageConnection:
      type: "object"
      required:
        - "id"
        - "provider"
        - "displayName"
        - "status"
        - "isDefault"
        - "usedBytes"
        - "quotaBytes"
      properties:
        id:
          type: "string"
          format: "uuid"
        provider:
          type: "string"
          enum:
            - "LOCAL"
            - "GOOGLE_DRIVE"
        displayName:
          type: "string"
        status:
          type: "string"
        isDefault:
          type: "boolean"
        usedBytes:
          type: "integer"
        quotaBytes:
          type: "integer"
    StorageConnectionsResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          type: "array"
          items:
            "$ref": "#/components/schemas/StorageConnection"
    MediaFile:
      type: "object"
      required:
        - "id"
        - "originalName"
        - "mimeType"
        - "sizeBytes"
        - "status"
        - "version"
      properties:
        id:
          type: "string"
          format: "uuid"
        storageConnectionId:
          type: "string"
          format: "uuid"
        provider:
          type: "string"
        purpose:
          type: "string"
        originalName:
          type: "string"
        mimeType:
          type: "string"
        sizeBytes:
          type: "integer"
        status:
          type: "string"
          enum:
            - "UPLOADING"
            - "READY"
            - "FAILED"
            - "DELETED"
        learnerDownloadAllowed:
          type: "boolean"
        version:
          type: "integer"
          minimum: 0
        createdAt:
          type:
            - "string"
            - "null"
          format: "date-time"
    MediaFileResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          "$ref": "#/components/schemas/MediaFile"
    MediaFilePage:
      type: "object"
      required:
        - "data"
        - "meta"
      properties:
        data:
          type: "array"
          items:
            "$ref": "#/components/schemas/MediaFile"
        meta:
          "$ref": "#/components/schemas/PageMetadata"
    FileUpload:
      type: "object"
      required:
        - "file"
      properties:
        file:
          type: "string"
          format: "binary"
        storageConnectionId:
          type: "string"
          format: "uuid"
        purpose:
          type: "string"
          enum:
            - "LESSON_ASSET"
            - "PROFILE_ASSET"
            - "NOTE_ASSET"
            - "REVIEW_ASSET"
          default: "LESSON_ASSET"
        learnerDownloadAllowed:
          type: "boolean"
          default: false
    FilePolicyInput:
      type: "object"
      required:
        - "version"
