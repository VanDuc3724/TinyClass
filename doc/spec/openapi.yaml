  "/auth/google/authorize":
    get:
      tags:
        - "Authentication"
      operationId: "authorizeGoogle"
      summary: "Redirect to Google after a prepared start"
      description: "Consumes the pending server-bound flow. Asks only openid/email/profile; Google login does not authorize Drive. Application-generated OAuth state, nonce and PKCE are retained in the session. Direct navigation without preparation returns GOOGLE_CONTEXT_EXPIRED."
      security: []
      responses:
        "302":
          description: "Google authorization redirect."
          headers:
            Location:
              description: "Redirect chosen by the server."
              schema:
                type: "string"
        "400":
          description: "GOOGLE_CONTEXT_EXPIRED."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
  "/auth/google/callback":
    get:
      tags:
        - "Authentication"
      operationId: "googleCallback"
      summary: "Receive the OIDC authorization-code callback"
      description: "Handled by Spring Security. Validates code exchange/PKCE, state, nonce, issuer, audience, signature and expiration. Identity lookup uses verified issuer/subject; never merges by email. Replaces the OAuth principal with a database-backed local principal. Does not retain authorized-client access/refresh tokens. Success/failure always redirects to the fixed frontend result route. A denied business mapping restores an eligible previous local session."
      security: []
      parameters:
        -
          name: "state"
          in: "query"
          schema:
            type: "string"
        -
          name: "code"
          in: "query"
          schema:
            type: "string"
        -
          name: "error"
          in: "query"
          schema:
            type: "string"
      responses:
        "302":
          description: "Fixed application /auth/google/result; no Google tokens in the target URL."
          headers:
            Location:
              description: "Redirect chosen by the server."
              schema:
                type: "string"
