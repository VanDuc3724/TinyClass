    FamilyClass:
      type: "object"
      required:
        - "id"
        - "name"
        - "description"
        - "location"
        - "status"
        - "enrollmentStatus"
        - "startDate"
        - "endDate"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        description:
          type:
            - "string"
            - "null"
        location:
          type:
            - "string"
            - "null"
        status:
          type: "string"
          enum:
            - "ACTIVE"
            - "COMPLETED"
        enrollmentStatus:
          type: "string"
          enum:
            - "ACTIVE"
            - "COMPLETED"
        startDate:
          type:
            - "string"
            - "null"
          format: "date"
        endDate:
          type:
            - "string"
            - "null"
          format: "date"
    FamilyClassPage:
      type: "object"
      required:
        - "data"
        - "meta"
      properties:
        data:
          type: "array"
          items:
            "$ref": "#/components/schemas/FamilyClass"
        meta:
          "$ref": "#/components/schemas/PageMetadata"
    AuthProvidersResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          type: "object"
          required:
            - "googleEnabled"
          properties:
            googleEnabled:
              type: "boolean"
    GoogleStartInput:
      type: "object"
      required:
        - "intent"
      properties:
        intent:
          type: "string"
          enum:
            - "LOGIN"
            - "REGISTER"
            - "LINK"
            - "REAUTHENTICATE"
        invitationToken:
          type: "string"
          minLength: 32
          maxLength: 256
          writeOnly: true
        displayName:
          type: "string"
          maxLength: 100
      description: "REGISTER needs a valid pending invitation. LINK and REAUTHENTICATE need an active account; LINK consumes explicit recent authentication. Account role and user ID are never accepted from this body."
    GoogleStartResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          type: "object"
          required:
            - "authorizationUrl"
          properties:
            authorizationUrl:
              type: "string"
              const: "/api/v1/auth/google/authorize"
    GoogleResultResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          type: "object"
          required:
            - "status"
            - "code"
            - "nextPath"
            - "createdAt"
          properties:
            status:
              type: "string"
              enum:
                - "SUCCESS"
                - "ERROR"
            code:
              type: "string"
            nextPath:
              type: "string"
              description: "Server-selected internal path; can include a pending invitation fragment. Never an arbitrary redirect or Google token."
            createdAt:
              type: "string"
              format: "date-time"
    AuthMethodsResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          type: "object"
          required:
            - "hasPassword"
            - "googleEnabled"
            - "google"
            - "reauthenticated"
          properties:
            hasPassword:
              type: "boolean"
            googleEnabled:
              type: "boolean"
            reauthenticated:
              type: "boolean"
            google:
              oneOf:
                - type: "null"
                - "$ref": "#/components/schemas/GoogleMethod"
    GoogleMethod:
      type: "object"
      required:
        - "id"
        - "email"
        - "linkedAt"
      properties:
        id:
          type: "string"
          format: "uuid"
        email:
          type:
            - "string"
            - "null"
        linkedAt:
          type: "string"
          format: "date-time"
      description: "Safe method metadata only. No subject, ID token, access token, client secret or refresh token."
    ReauthenticateInput:
      type: "object"
      required:
        - "password"
      properties:
        password:
          type: "string"
          minLength: 1
          maxLength: 128
          writeOnly: true
    LessonSummary:
