      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        action:
          type: "string"
          enum:
            - "ANNOUNCEMENT_CREATED"
            - "ANNOUNCEMENT_UPDATED"
            - "ANNOUNCEMENT_PUBLISHED"
            - "ANNOUNCEMENT_ARCHIVED"
        actorName:
          type: "string"
        reason:
          type:
            - "string"
            - "null"
        createdAt:
          type: "string"
          format: "date-time"
        changedFields:
          type: "object"
          properties:
            before:
              anyOf:
                -
                  "$ref": "#/components/schemas/TeacherAnnouncement"
                -
                  type: "object"
                  maxProperties: 0
            after:
              "$ref": "#/components/schemas/TeacherAnnouncement"
          required:
            - "before"
            - "after"
      required:
        - "id"
        - "action"
        - "actorName"
        - "reason"
        - "createdAt"
        - "changedFields"
    PersonalNotification:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        type:
          type: "string"
          enum:
            - "ANNOUNCEMENT_PUBLISHED"
            - "ANNOUNCEMENT_UPDATED"
            - "ASSIGNMENT_PUBLISHED"
            - "SUBMISSION_SENT"
            - "SUBMISSION_REVIEWED"
            - "SESSION_CHANGED"
            - "SESSION_CANCELLED"
            - "INVOICE_ISSUED"
            - "PAYMENT_RECORDED"
            - "PAYMENT_VOIDED"
        studentId:
          type: "string"
          format: "uuid"
        classId:
          type:
            - "string"
            - "null"
          format: "uuid"
        studentName:
          type: "string"
        className:
          type:
            - "string"
            - "null"
        title:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
        readAt:
          type:
            - "string"
            - "null"
          format: "date-time"
        targetPath:
          type: "string"
          pattern: "^/(teacher|family)/"
      required:
        - "id"
        - "type"
        - "studentId"
        - "classId"
        - "studentName"
        - "className"
        - "title"
        - "createdAt"
        - "readAt"
        - "targetPath"
      description: "Recipient-only current-source projection. Server produces generic text and internal destination after source authorization. No stored body, private notes/reasons, tokens, dedupe key or other recipient IDs. Never use cached targetPath as authority: POST read/open rechecks source and returns a fresh destination. Personal read does not acknowledge announcement revision."
    TeacherAnnouncementResponse:
      type: "object"
      properties:
        data:
          "$ref": "#/components/schemas/TeacherAnnouncement"
      required:
        - "data"
    FamilyAnnouncementResponse:
      type: "object"
      properties:
        data:
          "$ref": "#/components/schemas/FamilyAnnouncement"
      required:
        - "data"
    PersonalNotificationResponse:
      type: "object"
      properties:
        data:
          "$ref": "#/components/schemas/PersonalNotification"
      required:
        - "data"
    TeacherAnnouncementPage:
      type: "object"
      properties:
        data:
          type: "array"
          items:
            "$ref": "#/components/schemas/TeacherAnnouncementSummary"
        meta:
          "$ref": "#/components/schemas/PageMetadata"
      required:
        - "data"
        - "meta"
    FamilyAnnouncementPage:
      type: "object"
      properties:
        data:
          type: "array"
          items:
            "$ref": "#/components/schemas/FamilyAnnouncementSummary"
        meta:
          "$ref": "#/components/schemas/PageMetadata"
      required:
        - "data"
        - "meta"
    AnnouncementHistoryPage:
      type: "object"
      properties:
        data:
          type: "array"
          items:
            "$ref": "#/components/schemas/AnnouncementHistoryEvent"
        meta:
          "$ref": "#/components/schemas/PageMetadata"
      required:
        - "data"
        - "meta"
    PersonalNotificationPage:
      type: "object"
      properties:
        data:
          type: "array"
          items:
            "$ref": "#/components/schemas/PersonalNotification"
        meta:
          "$ref": "#/components/schemas/PageMetadata"
      required:
        - "data"
        - "meta"
    NotificationUnreadResponse:
      type: "object"
      properties:
        data:
          type: "object"
          properties:
            unreadCount:
              type: "integer"
              minimum: 0
          required:
            - "unreadCount"
      required:
        - "data"
    DashboardDueInvoice:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        invoiceCode:
          type: "string"
        studentName:
          type: "string"
        className:
          type: "string"
        dueOn:
          type:
            - "string"
            - "null"
          format: "date"
        totalAmountVnd:
          type: "integer"
          minimum: 0
          maximum: 1000000000000
        paidAmountVnd:
          type: "integer"
          minimum: 0
          maximum: 1000000000000
        outstandingAmountVnd:
          type: "integer"
          minimum: 0
          maximum: 1000000000000
      required:
        - "id"
        - "invoiceCode"
        - "studentName"
        - "className"
        - "dueOn"
        - "totalAmountVnd"
        - "paidAmountVnd"
        - "outstandingAmountVnd"
    DashboardBilling:
      type: "object"
      properties:
        openInvoiceCount:
          type: "integer"
          minimum: 0
        overdueInvoiceCount:
          type: "integer"
          minimum: 0
        outstandingAmountVnd:
          type: "string"
          pattern: "^(0|[1-9][0-9]*)$"
          description: "Exact non-negative integer VND serialized as a string. Sum may exceed JavaScript safe integer range. Display using BigInt/Intl, never parse as Number."
        receivedThisMonthVnd:
          type: "string"
          pattern: "^(0|[1-9][0-9]*)$"
          description: "Exact non-negative integer VND serialized as a string. Sum may exceed JavaScript safe integer range. Display using BigInt/Intl, never parse as Number."
        monthStart:
          type: "string"
          format: "date"
        dueInvoices:
          type: "array"
          items:
            "$ref": "#/components/schemas/DashboardDueInvoice"
          maxItems: 4
      required:
        - "openInvoiceCount"
        - "overdueInvoiceCount"
        - "outstandingAmountVnd"
        - "receivedThisMonthVnd"
        - "monthStart"
        - "dueInvoices"
      description: "OPEN means ISSUED and positive total minus RECORDED payments. OVERDUE additionally has dueOn strictly before businessDate (due today is not overdue). Draft/cancelled/zero/settled do not add debt; VOIDED is excluded. Monthly receipts sum RECORDED money by paidAt within the Vietnam calendar month, not entry creation time. Historical issued invoices in completed/archived classes remain included. Invoice preview at most four, overdue first then due date with unset date last. Aggregate totals are exact strings; individual invoice money remains safe integer."
    DashboardUpdates:
      type: "object"
      properties:
        unreadCount:
          type: "integer"
          minimum: 0
        recent:
          type: "array"
          items:
            "$ref": "#/components/schemas/PersonalNotification"
          maxItems: 3
      required:
        - "unreadCount"
        - "recent"
      description: "At most three recipient updates and unread count, filtered by the same current-source predicate before limiting/counting. Optional teacher class or parent child scope. Opening still uses POST /notifications/{id}/read for current authorization."
    DashboardContinueAssignment:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        title:
          type: "string"
        className:
          type:
            - "string"
            - "null"
        requiredItems:
          type: "integer"
          minimum: 0
        completedItems:
          type: "integer"
          minimum: 0
        completionPercent:
          type:
            - "integer"
            - "null"
          minimum: 0
          maximum: 100
      required:
        - "id"
        - "title"
        - "className"
        - "requiredItems"
        - "completedItems"
        - "completionPercent"
    FamilyLearningOverview:
      type: "object"
      properties:
        availableAssignments:
          type: "integer"
          minimum: 0
        waitingAssignments:
          type: "integer"
          minimum: 0
        requiredItems:
          type: "integer"
          minimum: 0
        completedItems:
          type: "integer"
          minimum: 0
        remainingItems:
          type: "integer"
          minimum: 0
        continueAssignment:
          anyOf:
            -
              "$ref": "#/components/schemas/DashboardContinueAssignment"
            -
              type: "null"
        recentAssignments:
          type: "array"
          items:
            "$ref": "#/components/schemas/FamilyAssignment"
          maxItems: 3
      required:
        - "availableAssignments"
        - "waitingAssignments"
        - "requiredItems"
        - "completedItems"
        - "remainingItems"
        - "continueAssignment"
        - "recentAssignments"
      description: "Visible open/future assignments follow AssignmentService family rights. Required/completed/remaining only concern open, non-reference required items the child can currently act on. Read-only COMPLETED class history does not create an unfinished task. No synthetic percentage when requiredItems is zero. Continue points to an accessible open unfinished assignment, earliest due date first. Never auto-complete from opening media."
    FamilyScheduleOverview:
      type: "object"
      properties:
        todaySessionCount:
          type: "integer"
          minimum: 0
        upcoming:
          type: "array"
          items:
            "$ref": "#/components/schemas/FamilyTeachingSession"
          maxItems: 3
      required:
        - "todaySessionCount"
        - "upcoming"
      description: "Uses calendar current guardian/child/enrollment/class/time rights. Count SCHEDULED/COMPLETED sessions in Vietnam today, excluding cancelled. Upcoming only SCHEDULED starts >= now and before midnight Vietnam at businessDate + 8 days, first three chronologically; no lesson plan/private fields."
    FamilyAnnouncementOverview:
      type: "object"
      properties:
        unreadCount:
          type: "integer"
          minimum: 0
        recent:
          type: "array"
          items:
            "$ref": "#/components/schemas/FamilyAnnouncementSummary"
          maxItems: 3
      required:
        - "unreadCount"
        - "recent"
      description: "Same source rights as family announcements before counting/limiting. Unread compares this parent acknowledgement against current publication revision."
    FamilyFeedbackPreview:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        status:
          type: "string"
          enum:
            - "ACCEPTED"
            - "CHANGES_REQUESTED"
        reviewedAt:
          type: "string"
          format: "date-time"
        lessonTitle:
          type: "string"
        assignmentTitle:
          type: "string"
        className:
          type:
            - "string"
            - "null"
      required:
        - "id"
        - "status"
        - "reviewedAt"
        - "lessonTitle"
        - "assignmentTitle"
        - "className"
    FamilyChildDashboard:
      type: "object"
      properties:
        student:
          type: "object"
          properties:
            id:
              type: "string"
              format: "uuid"
            fullName:
              type: "string"
          required:
            - "id"
            - "fullName"
        businessDate:
          type: "string"
          format: "date"
        learning:
          "$ref": "#/components/schemas/FamilyLearningOverview"
        schedule:
          "$ref": "#/components/schemas/FamilyScheduleOverview"
        billing:
          "$ref": "#/components/schemas/DashboardBilling"
        announcements:
          "$ref": "#/components/schemas/FamilyAnnouncementOverview"
        updates:
          "$ref": "#/components/schemas/DashboardUpdates"
        awaitingReview:
          type: "integer"
          minimum: 0
        recentFeedback:
          type: "array"
          items:
            "$ref": "#/components/schemas/FamilyFeedbackPreview"
          maxItems: 3
      required:
        - "student"
        - "businessDate"
        - "learning"
        - "schedule"
        - "billing"
        - "announcements"
        - "updates"
        - "awaitingReview"
        - "recentFeedback"
      description: "Verified PARENT with active guardian for this exact child. One repeatable-read snapshot. Reuses source permissions: withdrawal/archive removes learning/calendar/wall, but sent submissions/feedback and ever-issued invoices/payment history remain while guardian stays active. Revocation returns 404 for whole child dashboard. No private reason/note, management version, request/hash, teacher-only audit or counts for another child. AwaitingReview counts already submitted products, including authorized historical work."
    FamilyHomeDashboard:
      type: "object"
      properties:
        businessDate:
          type: "string"
          format: "date"
        linkedChildren:
          type: "integer"
          minimum: 0
        updates:
          "$ref": "#/components/schemas/DashboardUpdates"
      required:
        - "businessDate"
        - "linkedChildren"
        - "updates"
      description: "Account-level updates for all currently authorized children, explicitly distinct from a selected child scope. Linked profile count includes archived profiles when active guardian link remains. Parent must have verified email; no notification from a revoked link affects counts or previews."
    FamilyChildDashboardResponse:
      type: "object"
      properties:
        data:
          "$ref": "#/components/schemas/FamilyChildDashboard"
      required:
        - "data"
    FamilyHomeDashboardResponse:
      type: "object"
      properties:
        data:
          "$ref": "#/components/schemas/FamilyHomeDashboard"
      required:
        - "data"
