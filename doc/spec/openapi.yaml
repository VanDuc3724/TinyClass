    post:
      tags:
        - "Payments"
      operationId: "recordInvoicePayment"
      summary: "Record money received against an issued invoice"
      description: "TEACHER owner only. Idempotency-Key required. Serialize with payment void and invoice cancel under class → student → enrollment → invoice locks. Only a new ISSUED invoice request with positive remaining/current invoiceVersion can record, amount no more than remaining; bump invoice version and write payment + payment/invoice audit atomically. Same key and initial submitted payload returns the same payment with 201 before current version/status/balance/date checks, even after settlement, VOIDED or invoice cancellation; different invoice/payload under the same teacher/key conflicts. No automatic reapplication of voided money. Source changes/withdrawal/archive do not prevent settling an already-issued invoice."
      security:
        -
          sessionCookie: []
      parameters:
        -
          "$ref": "#/components/parameters/RequestId"
        -
          name: "invoice"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          name: "Idempotency-Key"
          in: "header"
          required: true
          schema:
            type: "string"
            pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,99}$"
            minLength: 8
            maxLength: 100
        -
          "$ref": "#/components/parameters/Csrf"
      responses:
        "201":
          description: "Successful response."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PaymentMutationResponse"
        "400":
          description: "Invalid integer amount, date/method/notes, missing or malformed idempotency key, missing versions/reason or pagination."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "401":
          description: "Authentication required."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "403":
          description: "Wrong role, missing CSRF or unverified parent email."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "404":
          description: "Owned invoice/payment or active guardian link to this exact child/ever-issued invoice unavailable."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "409":
          description: "Stale invoice/payment version, reused key with different invoice/payload, invoice not issued/settled, amount above remaining, or invoice still has recorded payments. Atomic failure."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PaymentRecordInput"
