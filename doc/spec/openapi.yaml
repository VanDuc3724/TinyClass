          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "413":
          description: "FILE_TOO_LARGE; per-kind or multipart limit exceeded."
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
        "503":
          description: "Storage temporarily unavailable; no path or provider diagnostics."
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ApiError"
      requestBody:
        required: true
        content:
          "multipart/form-data":
            schema:
              "$ref": "#/components/schemas/FileUpload"
