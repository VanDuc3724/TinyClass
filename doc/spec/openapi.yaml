components:
  securitySchemes:
    sessionCookie:
      type: "apiKey"
      in: "cookie"
      name: "JSESSIONID"
      description: "HttpOnly session cookie; Secure in production and SameSite=Lax. In-memory sessions expire after 30 minutes of inactivity and on server restart. Account role, status, password change time and credential version are checked against the database on subsequent requests. Password resets, linking/unlinking methods and adding a password invalidate older credential snapshots."
  parameters:
    Id:
      name: "id"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
    RequestId:
      name: "X-Request-ID"
      in: "header"
      required: false
      schema:
        type: "string"
        maxLength: 100
        pattern: "^[A-Za-z0-9._-]{1,100}$"
      description: "Invalid IDs are replaced with a UUID."
    Csrf:
      name: "X-CSRF-TOKEN"
      in: "header"
      required: true
      schema:
        type: "string"
      description: "Masked token from GET /auth/csrf. Refresh after login/logout and OAuth callbacks. Required on state-changing application endpoints, including Google start; OIDC redirect GETs use server-bound state and nonce instead."
    Page:
      name: "page"
      in: "query"
      schema:
        type: "integer"
        minimum: 0
        default: 0
    Size:
      name: "size"
      in: "query"
      schema:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: "q"
      in: "query"
      schema:
        type: "string"
        maxLength: 150
      description: "Case-insensitive literal substring. Percent and underscore are escaped. Lists use stable createdAt DESC, id DESC order."
  headers:
    RequestId:
      description: "Request correlation ID in headers, errors and logs."
      schema:
        type: "string"
  schemas:
    StorageConnection:
      type: "object"
      required:
        - "id"
        - "provider"
        - "displayName"
        - "status"
        - "isDefault"
        - "usedBytes"
        - "quotaBytes"
      properties:
        id:
          type: "string"
          format: "uuid"
        provider:
          type: "string"
          enum:
            - "LOCAL"
            - "GOOGLE_DRIVE"
        displayName:
          type: "string"
        status:
          type: "string"
        isDefault:
          type: "boolean"
        usedBytes:
          type: "integer"
        quotaBytes:
          type: "integer"
    StorageConnectionsResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          type: "array"
          items:
            "$ref": "#/components/schemas/StorageConnection"
    MediaFile:
      type: "object"
      required:
        - "id"
        - "originalName"
        - "mimeType"
        - "sizeBytes"
        - "status"
        - "version"
      properties:
        id:
          type: "string"
          format: "uuid"
        storageConnectionId:
          type: "string"
          format: "uuid"
        provider:
          type: "string"
        purpose:
          type: "string"
        originalName:
          type: "string"
        mimeType:
          type: "string"
        sizeBytes:
          type: "integer"
        status:
          type: "string"
          enum:
            - "UPLOADING"
            - "READY"
            - "FAILED"
            - "DELETED"
        learnerDownloadAllowed:
          type: "boolean"
        version:
          type: "integer"
          minimum: 0
        createdAt:
          type:
            - "string"
            - "null"
          format: "date-time"
    MediaFileResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          "$ref": "#/components/schemas/MediaFile"
    MediaFilePage:
      type: "object"
      required:
        - "data"
        - "meta"
      properties:
        data:
          type: "array"
          items:
            "$ref": "#/components/schemas/MediaFile"
        meta:
          "$ref": "#/components/schemas/PageMetadata"
    FileUpload:
      type: "object"
      required:
        - "file"
      properties:
        file:
          type: "string"
          format: "binary"
        storageConnectionId:
          type: "string"
          format: "uuid"
        purpose:
          type: "string"
          enum:
            - "LESSON_ASSET"
            - "PROFILE_ASSET"
            - "NOTE_ASSET"
            - "REVIEW_ASSET"
          default: "LESSON_ASSET"
        learnerDownloadAllowed:
          type: "boolean"
          default: false
    FilePolicyInput:
      type: "object"
      required:
        - "version"
        - "learnerDownloadAllowed"
      properties:
        version:
          type: "integer"
          minimum: 0
        learnerDownloadAllowed:
          type: "boolean"
    Topic:
      type: "object"
      required:
        - "id"
        - "name"
        - "version"
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
        description:
          type:
            - "string"
            - "null"
        version:
          type: "integer"
          minimum: 0
        archivedAt:
          type:
            - "string"
            - "null"
          format: "date-time"
    TopicsResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          type: "array"
          items:
            "$ref": "#/components/schemas/Topic"
    TopicResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          "$ref": "#/components/schemas/Topic"
    TopicInput:
      type: "object"
      required:
        - "name"
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 100
        description:
          type:
            - "string"
            - "null"
          maxLength: 3000
        version:
          type: "integer"
          minimum: 0
        archived:
          type: "boolean"
          default: false
    LessonBlockInput:
      type: "object"
      required:
        - "type"
      properties:
        type:
          type: "string"
          enum:
            - "TEXT"
            - "IMAGE"
            - "AUDIO"
            - "VIDEO"
            - "PDF"
        textContent:
          type:
            - "string"
            - "null"
          maxLength: 20000
        fileId:
          type:
            - "string"
            - "null"
          format: "uuid"
        caption:
          type:
            - "string"
            - "null"
          maxLength: 500
        altText:
          type:
            - "string"
            - "null"
          maxLength: 500
    LessonBlock:
      allOf:
        -
          "$ref": "#/components/schemas/LessonBlockInput"
        -
          type: "object"
          properties:
            id:
              type: "string"
              format: "uuid"
            position:
              type: "integer"
            mimeType:
              type:
                - "string"
                - "null"
            originalName:
              type:
                - "string"
                - "null"
            learnerDownloadAllowed:
              type:
                - "boolean"
                - "null"
    LessonInput:
      type: "object"
      required:
        - "title"
        - "defaultCompletionMode"
        - "defaultResponseTypes"
        - "topicIds"
        - "blocks"
      properties:
        title:
          type: "string"
          minLength: 1
          maxLength: 200
        summary:
          type:
            - "string"
            - "null"
          maxLength: 1000
        parentGuidance:
          type:
            - "string"
            - "null"
          maxLength: 10000
        activityInstructions:
          type:
            - "string"
            - "null"
          maxLength: 20000
        estimatedMinutes:
          type:
            - "integer"
            - "null"
          minimum: 1
          maximum: 240
        defaultCompletionMode:
          type: "string"
          enum:
            - "REFERENCE"
            - "PARENT_CONFIRM"
            - "TEACHER_REVIEW"
        defaultResponseTypes:
          type: "array"
          maxItems: 4
          uniqueItems: true
          items:
            type: "string"
            enum:
              - "TEXT"
              - "IMAGE"
              - "AUDIO"
              - "VIDEO"
        topicIds:
          type: "array"
          maxItems: 30
          uniqueItems: true
          items:
            type: "string"
            format: "uuid"
        blocks:
          type: "array"
          maxItems: 50
          items:
            "$ref": "#/components/schemas/LessonBlockInput"
        version:
          type: "integer"
          minimum: 0
        acknowledgeSharedUpdate:
          type: "boolean"
          default: false
    Lesson:
      allOf:
        -
          "$ref": "#/components/schemas/LessonInput"
        -
          type: "object"
          properties:
            id:
              type: "string"
              format: "uuid"
            status:
              type: "string"
              enum:
                - "DRAFT"
                - "PUBLISHED"
                - "ARCHIVED"
            createdAt:
              type:
                - "string"
                - "null"
              format: "date-time"
            publishedAt:
              type:
                - "string"
                - "null"
              format: "date-time"
            blocks:
              type: "array"
              items:
                "$ref": "#/components/schemas/LessonBlock"
    LessonResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          "$ref": "#/components/schemas/Lesson"
    LessonPage:
      type: "object"
      required:
        - "data"
        - "meta"
      properties:
        data:
          type: "array"
          items:
            "$ref": "#/components/schemas/LessonSummary"
        meta:
          "$ref": "#/components/schemas/PageMetadata"
    CourseLessonInput:
      type: "object"
      required:
        - "lessonId"
        - "isRequired"
      properties:
        lessonId:
          type: "string"
          format: "uuid"
        isRequired:
          type: "boolean"
    CourseInput:
      type: "object"
      required:
        - "title"
        - "lessons"
      properties:
        title:
          type: "string"
          minLength: 1
          maxLength: 200
        description:
          type:
            - "string"
            - "null"
          maxLength: 10000
        minAgeMonths:
          type:
            - "integer"
            - "null"
          minimum: 0
          maximum: 216
        maxAgeMonths:
          type:
            - "integer"
            - "null"
          minimum: 0
          maximum: 216
        lessons:
          type: "array"
          maxItems: 100
          items:
            "$ref": "#/components/schemas/CourseLessonInput"
        version:
          type: "integer"
          minimum: 0
        acknowledgeSharedUpdate:
          type: "boolean"
          default: false
    Course:
      allOf:
        -
          "$ref": "#/components/schemas/CourseInput"
        -
          type: "object"
          properties:
            id:
              type: "string"
              format: "uuid"
            status:
              type: "string"
            createdAt:
              type:
                - "string"
                - "null"
              format: "date-time"
            publishedAt:
              type:
                - "string"
                - "null"
              format: "date-time"
            lessons:
              type: "array"
              items:
                allOf:
                  -
                    "$ref": "#/components/schemas/CourseLessonInput"
                  -
                    type: "object"
                    properties:
                      title:
                        type: "string"
                      position:
                        type: "integer"
                      status:
                        type: "string"
                      defaultCompletionMode:
                        type: "string"
                        enum:
                          - "REFERENCE"
                          - "PARENT_CONFIRM"
                          - "TEACHER_REVIEW"
    CourseResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          "$ref": "#/components/schemas/Course"
    CoursePage:
      type: "object"
      required:
        - "data"
        - "meta"
      properties:
        data:
          type: "array"
          items:
            "$ref": "#/components/schemas/CourseSummary"
        meta:
          "$ref": "#/components/schemas/PageMetadata"
    AssignmentCreateInput:
      type: "object"
      required:
        - "title"
        - "sourceType"
        - "targetType"
        - "clientRequestId"
      properties:
        title:
          type: "string"
          minLength: 1
          maxLength: 200
        sourceType:
          type: "string"
          enum:
            - "LESSON"
            - "COURSE"
        lessonId:
          type:
            - "string"
            - "null"
          format: "uuid"
        courseId:
          type:
            - "string"
            - "null"
          format: "uuid"
        targetType:
          type: "string"
          enum:
            - "CLASS"
            - "STUDENT"
        classId:
          type:
            - "string"
            - "null"
          format: "uuid"
        studentId:
          type:
            - "string"
            - "null"
          format: "uuid"
        availableAt:
          type:
            - "string"
            - "null"
          format: "date-time"
        dueAt:
          type:
            - "string"
            - "null"
          format: "date-time"
        clientRequestId:
          type: "string"
          format: "uuid"
    AssignmentItemInput:
      type: "object"
      required:
        - "id"
        - "isRequired"
        - "completionMode"
        - "allowedResponseTypes"
      properties:
        id:
          type: "string"
          format: "uuid"
        isRequired:
          type: "boolean"
        completionMode:
          type: "string"
          enum:
            - "REFERENCE"
            - "PARENT_CONFIRM"
            - "TEACHER_REVIEW"
        allowedResponseTypes:
          type: "array"
          maxItems: 4
          uniqueItems: true
          items:
            type: "string"
            enum:
              - "TEXT"
              - "IMAGE"
              - "AUDIO"
              - "VIDEO"
    AssignmentDraftInput:
      type: "object"
      required:
        - "title"
        - "version"
        - "items"
      properties:
        title:
          type: "string"
          minLength: 1
          maxLength: 200
        version:
          type: "integer"
          minimum: 0
        availableAt:
          type:
            - "string"
            - "null"
          format: "date-time"
        dueAt:
          type:
            - "string"
            - "null"
          format: "date-time"
        items:
          type: "array"
          maxItems: 100
          items:
            "$ref": "#/components/schemas/AssignmentItemInput"
    AssignmentItem:
      allOf:
        -
          "$ref": "#/components/schemas/AssignmentItemInput"
        -
          type: "object"
          properties:
            lessonId:
              type: "string"
              format: "uuid"
            title:
              type: "string"
            position:
              type: "integer"
            lessonStatus:
              type: "string"
            progressStatus:
              type:
                - "string"
                - "null"
            completedAt:
              type:
                - "string"
                - "null"
              format: "date-time"
    RecipientInput:
      type: "object"
      required:
        - "version"
        - "studentIds"
        - "reason"
      properties:
        version:
          type: "integer"
          minimum: 0
        studentIds:
          type: "array"
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: "string"
            format: "uuid"
        reason:
          type: "string"
          minLength: 1
          maxLength: 1000
    Assignment:
      allOf:
        -
          "$ref": "#/components/schemas/AssignmentCreateInput"
        -
          type: "object"
          properties:
            id:
              type: "string"
              format: "uuid"
            status:
              type: "string"
              enum:
                - "DRAFT"
                - "PUBLISHED"
                - "REVOKED"
            version:
              type: "integer"
              minimum: 0
            publishedAt:
              type:
                - "string"
                - "null"
              format: "date-time"
            revokedAt:
              type:
                - "string"
                - "null"
              format: "date-time"
            revokeReason:
              type:
                - "string"
                - "null"
            createdAt:
              type:
                - "string"
                - "null"
              format: "date-time"
            items:
              type: "array"
              items:
                "$ref": "#/components/schemas/AssignmentItem"
            recipients:
              type: "array"
              items:
                type: "object"
                properties:
                  id:
                    type: "string"
                    format: "uuid"
                  studentId:
                    type: "string"
                    format: "uuid"
                  fullName:
                    type: "string"
                  grantedAt:
                    type:
                      - "string"
                      - "null"
                    format: "date-time"
                  revokedAt:
                    type:
                      - "string"
                      - "null"
                    format: "date-time"
                  revokeReason:
                    type:
                      - "string"
                      - "null"
                  requiredItems:
                    type: "integer"
                  completedItems:
                    type: "integer"
                  completionPercent:
                    type:
                      - "integer"
                      - "null"
            className:
              type:
                - "string"
                - "null"
            studentName:
              type:
                - "string"
                - "null"
    AssignmentResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          "$ref": "#/components/schemas/Assignment"
    AssignmentPage:
      type: "object"
      required:
        - "data"
        - "meta"
      properties:
        data:
          type: "array"
          items:
            "$ref": "#/components/schemas/AssignmentSummary"
        meta:
          "$ref": "#/components/schemas/PageMetadata"
    FamilyAssignment:
      type: "object"
      required:
        - "id"
        - "title"
        - "locked"
        - "requiredItems"
        - "completedItems"
        - "completionPercent"
      properties:
        id:
          type: "string"
          format: "uuid"
        title:
          type: "string"
        sourceType:
          type: "string"
        targetType:
          type: "string"
        availableAt:
          type:
            - "string"
            - "null"
          format: "date-time"
        dueAt:
          type:
            - "string"
            - "null"
          format: "date-time"
        className:
          type:
            - "string"
            - "null"
        locked:
          type: "boolean"
        canInteract:
          type: "boolean"
        requiredItems:
          type: "integer"
        completedItems:
          type: "integer"
        completionPercent:
          type:
            - "integer"
            - "null"
          minimum: 0
          maximum: 100
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/FamilyAssignmentItem"
    FamilyAssignmentResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          "$ref": "#/components/schemas/FamilyAssignment"
    FamilyAssignmentPage:
      type: "object"
      required:
        - "data"
        - "meta"
      properties:
        data:
          type: "array"
          items:
            "$ref": "#/components/schemas/FamilyAssignment"
        meta:
          "$ref": "#/components/schemas/PageMetadata"
    FamilyLesson:
      type: "object"
      required:
        - "id"
        - "assignmentId"
        - "title"
        - "blocks"
        - "completionMode"
        - "canInteract"
        - "progress"
      properties:
        id:
          type: "string"
          format: "uuid"
        assignmentId:
          type: "string"
          format: "uuid"
        title:
          type: "string"
        summary:
          type:
            - "string"
            - "null"
        parentGuidance:
          type:
            - "string"
            - "null"
        activityInstructions:
          type:
            - "string"
            - "null"
        estimatedMinutes:
          type:
            - "integer"
            - "null"
        blocks:
          type: "array"
          items:
            "$ref": "#/components/schemas/LessonBlock"
        completionMode:
          type: "string"
          enum:
            - "REFERENCE"
            - "PARENT_CONFIRM"
            - "TEACHER_REVIEW"
        isRequired:
          type: "boolean"
        canInteract:
          type: "boolean"
        progress:
          oneOf:
            -
              type: "null"
            -
              type: "object"
              properties:
                status:
                  type: "string"
                  enum:
                    - "OPENED"
                    - "SUBMITTED"
                    - "NEEDS_REVISION"
                    - "COMPLETED"
                firstOpenedAt:
                  type: "string"
                  format: "date-time"
                lastOpenedAt:
                  type: "string"
                  format: "date-time"
                parentConfirmedAt:
                  type:
                    - "string"
                    - "null"
                  format: "date-time"
                teacherAcceptedAt:
                  type:
                    - "string"
                    - "null"
                  format: "date-time"
                completedAt:
                  type:
                    - "string"
                    - "null"
                  format: "date-time"
                reviewCycle:
                  type: "integer"
                  minimum: 0
                version:
                  type: "integer"
                  minimum: 0
                reopenReason:
                  type:
                    - "string"
                    - "null"
              required:
                - "status"
                - "firstOpenedAt"
                - "lastOpenedAt"
                - "parentConfirmedAt"
                - "teacherAcceptedAt"
                - "completedAt"
                - "reviewCycle"
                - "version"
                - "reopenReason"
    FamilyLessonResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          "$ref": "#/components/schemas/FamilyLesson"
    HealthResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          type: "object"
          required:
            - "status"
          properties:
            status:
              type: "string"
              enum:
                - "UP"
                - "DOWN"
    ApiError:
      type: "object"
      required:
        - "code"
        - "message"
        - "fieldErrors"
        - "traceId"
      properties:
        code:
          type: "string"
        message:
          type: "string"
        fieldErrors:
          type: "array"
          items:
            type: "object"
            required:
              - "field"
              - "message"
            properties:
              field:
                type: "string"
              message:
                type: "string"
        traceId:
          type: "string"
    PageMetadata:
      type: "object"
      required:
        - "page"
        - "size"
        - "totalElements"
        - "totalPages"
      properties:
        page:
          type: "integer"
          minimum: 0
        size:
          type: "integer"
          minimum: 1
          maximum: 100
        totalElements:
          type: "integer"
          format: "int64"
          minimum: 0
        totalPages:
          type: "integer"
          minimum: 0
    MoneyVnd:
      type: "integer"
      format: "int64"
      minimum: 0
      maximum: 1000000000000
      description: "Reserved for the future billing module."
    Account:
      type: "object"
      required:
        - "id"
        - "email"
        - "displayName"
        - "role"
        - "status"
        - "emailVerifiedAt"
      properties:
        id:
          type: "string"
          format: "uuid"
        email:
          type: "string"
          format: "email"
        displayName:
          type: "string"
        role:
          type: "string"
          enum:
            - "TEACHER"
            - "PARENT"
        status:
          type: "string"
          enum:
            - "ACTIVE"
            - "DISABLED"
        emailVerifiedAt:
          type:
            - "string"
            - "null"
          format: "date-time"
    AccountResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          "$ref": "#/components/schemas/Account"
    CsrfResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          type: "object"
          required:
            - "headerName"
            - "token"
          properties:
            headerName:
              type: "string"
              const: "X-CSRF-TOKEN"
            token:
              type: "string"
    SetupStatusResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          type: "object"
          required:
            - "setupRequired"
            - "setupEnabled"
          properties:
            setupRequired:
              type: "boolean"
            setupEnabled:
              type: "boolean"
    BooleanResponse:
      type: "object"
      required:
        - "data"
      properties:
        data:
          type: "boolean"
    LoginInput:
      type: "object"
      required:
        - "email"
        - "password"
      properties:
        email:
          type: "string"
          format: "email"
          maxLength: 254
        password:
          type: "string"
          minLength: 1
          maxLength: 128
          writeOnly: true
    SetupInput:
      type: "object"
      required:
        - "displayName"
        - "email"
        - "password"
        - "setupKey"
      properties:
        displayName:
          type: "string"
          minLength: 1
          maxLength: 100
        email:
          type: "string"
          format: "email"
          maxLength: 254
        password:
          type: "string"
          minLength: 12
          maxLength: 128
          writeOnly: true
        setupKey:
          type: "string"
          minLength: 1
          maxLength: 256
          writeOnly: true
    VersionInput:
      type: "object"
      required:
        - "version"
      properties:
        version:
          type: "integer"
          format: "int64"
          minimum: 0
        reason:
          type:
            - "string"
            - "null"
          maxLength: 1000
    ClassFields:
      type: "object"
      required:
        - "name"
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 150
        description:
          type:
            - "string"
            - "null"
          maxLength: 5000
        minAgeMonths:
          type:
            - "integer"
            - "null"
          minimum: 0
        maxAgeMonths:
          type:
            - "integer"
