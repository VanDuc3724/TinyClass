spring.config.import=optional:file:../.env[.properties]

server.address=127.0.0.1
server.servlet.session.cookie.secure=false
spring.datasource.url=${TINYCLASS_TEST_DATABASE_URL:jdbc:postgresql://127.0.0.1:${TINYCLASS_TEST_DB_PORT:55433}/tinyclass_test}
spring.datasource.username=tinyclass_test
spring.datasource.password=${TINYCLASS_TEST_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
tinyclass.mail.enabled=true
tinyclass.public-url=http://127.0.0.1:5174
spring.mail.host=127.0.0.1
spring.mail.port=11026
tinyclass.storage.local-root=../.local/test-uploads
