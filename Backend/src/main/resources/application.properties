spring.application.name=tinyclass-backend
spring.profiles.default=local

server.port=${TINYCLASS_SERVER_PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
tinyclass.auth.setup-key=${TINYCLASS_SETUP_KEY:}
tinyclass.invitations.ttl-hours=${TINYCLASS_INVITATION_TTL_HOURS:48}
tinyclass.mail.enabled=${TINYCLASS_MAIL_ENABLED:false}
tinyclass.mail.from=${TINYCLASS_MAIL_FROM:noreply@tinyclass.test}
tinyclass.mail.cooldown-seconds=${TINYCLASS_MAIL_COOLDOWN_SECONDS:60}
tinyclass.auth.attempt-limit=${TINYCLASS_AUTH_ATTEMPT_LIMIT:20}
tinyclass.google.enabled=${TINYCLASS_GOOGLE_LOGIN_ENABLED:false}
tinyclass.google.client-id=${TINYCLASS_GOOGLE_CLIENT_ID:}
tinyclass.google.client-secret=${TINYCLASS_GOOGLE_CLIENT_SECRET:}
tinyclass.public-url=${TINYCLASS_PUBLIC_URL:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
server.error.include-message=never
server.error.include-stacktrace=never

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.sql.init.mode=never
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=false
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=201MB
spring.servlet.multipart.file-size-threshold=0
tinyclass.storage.local-root=${TINYCLASS_UPLOAD_ROOT:../.local/uploads}
tinyclass.storage.quota-bytes=${TINYCLASS_STORAGE_QUOTA_BYTES:5368709120}

logging.pattern.level=%5p [requestId=%X{requestId:-}]
