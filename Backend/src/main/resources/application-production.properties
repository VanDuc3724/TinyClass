server.servlet.session.cookie.secure=true
spring.datasource.url=${TINYCLASS_DATABASE_URL}
spring.datasource.username=${TINYCLASS_DATABASE_USERNAME}
spring.datasource.password=${TINYCLASS_DATABASE_PASSWORD}
spring.mail.host=${TINYCLASS_MAIL_HOST:}
spring.mail.port=${TINYCLASS_MAIL_PORT:587}
spring.mail.username=${TINYCLASS_MAIL_USERNAME:}
spring.mail.password=${TINYCLASS_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${TINYCLASS_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
tinyclass.storage.local-root=${TINYCLASS_UPLOAD_ROOT}
