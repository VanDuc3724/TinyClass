spring.config.import=optional:file:../.env[.properties]

server.address=127.0.0.1
server.servlet.session.cookie.secure=false
spring.datasource.url=${TINYCLASS_DATABASE_URL:jdbc:postgresql://127.0.0.1:${TINYCLASS_DB_PORT:55432}/${TINYCLASS_DB_NAME:tinyclass}}
spring.datasource.username=${TINYCLASS_DATABASE_USERNAME:${TINYCLASS_DB_USER:tinyclass}}
spring.datasource.password=${TINYCLASS_DATABASE_PASSWORD:${TINYCLASS_DB_PASSWORD}}
spring.datasource.hikari.maximum-pool-size=5
tinyclass.mail.enabled=${TINYCLASS_MAIL_ENABLED:true}
tinyclass.public-url=${TINYCLASS_PUBLIC_URL:http://localhost:5173}
spring.mail.host=${TINYCLASS_MAIL_HOST:127.0.0.1}
spring.mail.port=${TINYCLASS_MAIL_PORT:11025}
